name: timbre
description: "Timbre is a fast, offline music player for the songs on your device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.6
  http: ^1.6.0
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  collection: ^1.19.1
  permission_handler: ^13.0.2
  home_widget: ^0.10.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.5.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/brand/

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0A0B0D"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: "#F6F3EC"
  color_dark: "#0A0B0D"
  image: assets/brand/splash_mark.png
  image_dark: assets/brand/splash_mark.png
  android_12:
    color: "#F6F3EC"
    color_dark: "#0A0B0D"
    icon_background_color: "#0A0B0D"
    icon_background_color_dark: "#0A0B0D"
    image: assets/brand/icon_foreground.png
    image_dark: assets/brand/icon_foreground.png
